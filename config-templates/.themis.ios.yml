# Template for iOS projects
scan:
  mode: diff
  max_file_size_bytes: 1048576
output:
  format: text
  redact_keep: 2
allowlist:
  paths: []
  regexes: []
  line_markers:
    - themis:ignore
rules:
  - id: PRIVATE_KEY_BLOCK
    severity: critical
    type: regex
    pattern: "BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY"
    message: "Private key block detected"
    enabled: true
  - id: GOOGLE_API_KEY
    severity: high
    type: regex
    pattern: "AIza[0-9A-Za-z-_]{35}"
    message: "Possible Google API key"
    enabled: true
  - id: IOS_PROVISIONING_PROFILE_MARKER
    severity: medium
    type: regex
    pattern: "\\b(ProvisionedDevices|ProvisionsAllDevices|application-identifier|com\\.apple\\.developer\\.team-identifier|aps-environment)\\b"
    message: "iOS provisioning profile content detected"
    enabled: true
